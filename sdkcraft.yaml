name: inference-snap-maker
adopt-info: version
title: Inference Snap Maker SDK
summary: AI-driven packaging of LLMs as inference snaps
description: |
  Use this SDK in a workshop to create inference snaps using OpenCode and LLMs.

build-base: ubuntu@26.04
platforms:
  amd64:

parts:
  version:
    plugin: nil
    override-pull: |
      craftctl set version="1.0"
  skills:
    plugin: dump
    source: skills/
    organize:
      "*": skills/
  agents:
    plugin: dump
    source: agents/
    organize:
      "*": agents/
  opencode-config:
    plugin: dump
    source: opencode/
    organize:
      "*": opencode/
